<!doctype html><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<style>
body{margin:0;background:#141518;color:#e8e8ea;font:13px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
h2{font-size:14px;color:#9aa0a6;font-weight:500;margin:0 0 8px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#1e2024;border-radius:10px;overflow:hidden;border:1px solid #2c2f34}
.pic{height:230px;display:flex;align-items:center;justify-content:center;background:#0f1012;overflow:hidden}
.pic img{max-width:100%;max-height:100%;display:block}
.a img{filter:invert(1) hue-rotate(180deg)}
.b img{filter:grayscale(1) invert(1)}
.c .pic{background:#000}
.c img{width:100%;height:100%;object-fit:cover;filter:brightness(.62) contrast(1.1) saturate(.7)}
.cap{padding:10px 12px;color:#c9cdd2;font-size:12px}
.cap b{color:#fff;display:block;font-size:13px;margin-bottom:2px}
</style>
<h2>Варианты тёмного фона</h2>
<div class="row">
  <div class="card a"><div class="pic"><img src="img/ex/bench-crop.jpg"></div><div class="cap"><b>Инверсия с цветом</b>наша схема, мышцы цветные</div></div>
  <div class="card b"><div class="pic"><img src="img/ex/bench-crop.jpg"></div><div class="cap"><b>Инверсия в белые линии</b>строго ч/б</div></div>
  <div class="card c"><div class="pic"><img src="img/sample-fedb.jpg"></div><div class="cap"><b>Фото с затемнением</b>free-exercise-db</div></div>
</div>
