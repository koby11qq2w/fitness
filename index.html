<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Тренировки — Тимофей и Кристина</title>
<link rel="stylesheet" href="style.css?v=20261128e">
</head>
<body data-p="tim">
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="title">Тренировки</span>
      <span class="sub">дневник весов</span>
    </div>
    <div class="viewtabs" id="viewtabs" role="tablist" aria-label="Раздел">
      <button data-v="workouts" role="tab">Тренировки</button>
      <button data-v="grid" class="on" role="tab">Упражнения</button>
      <button data-v="journal" role="tab">Журнал</button>
      <button data-v="measure" role="tab">Размеры</button>
      <button data-v="library" role="tab">Библиотека</button>
    </div>
    <div class="who" id="who" role="tablist" aria-label="Кто занимается">
      <button data-p="tim" role="tab" class="on">Тимофей</button>
      <button data-p="kristina" role="tab">Кристина</button>
    </div>
    <div class="topbar-r">
      <span class="live" id="live" title="связь с сервером"></span>
      <span class="upd" id="updated">загрузка…</span>
    </div>
  </div>
</header>

<main>
  <section class="workouts" id="workouts" aria-label="Тренировки" hidden></section>

  <section class="cards" id="cards" aria-label="Сводка"></section>

  <div class="toolbar">
    <nav class="filters" id="filters" aria-label="Группы мышц"></nav>
    <div class="toolbar-actions">
      <button class="ghost-add" id="new-ex">+ Новое упражнение</button>
      <button class="primary add-btn" id="add-btn">+ Записать подход</button>
    </div>
  </div>

  <section class="grid" id="grid" aria-label="Упражнения"></section>
  <section class="journal" id="journal" aria-label="Журнал тренировок" hidden></section>
  <section class="measure" id="measure" aria-label="Размеры тела" hidden></section>
  <section class="library" id="library" aria-label="Библиотека упражнений" hidden></section>

  <p class="foot muted">
    Данные зашифрованы и хранятся в GitHub. Пароль не хранится на сервере.
    Вес — в килограммах, включая гриф. Динамика считается по последним записям.
  </p>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-in" id="dlg-in"></div>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="shim.js?v=20261128e"></script>
<script src="app.js?v=20261128e"></script>
</body>
</html>
